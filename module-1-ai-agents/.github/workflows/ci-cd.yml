# ─────────────────────────────────────────────────────────────
# Module 1: CI/CD Pipeline — GitHub Actions
# Author: Geoffrey Jones Okwi
# Covers: test → build → push to DockerHub → deploy
# ─────────────────────────────────────────────────────────────

name: Production AI Agent CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: geoffreyokwi/production-ai-agent
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Run Tests ───────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest tests/ -v --tb=short

  # ── Job 2: Build & Push Docker Image ──────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy (AWS ECS stub) ──────────────────────────
  deploy:
    name: 🚀 Deploy to AWS ECS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying $IMAGE_NAME:${{ github.sha }} to ECS..."
          # aws ecs update-service \
          #   --cluster production-ai-agents \
          #   --service ai-agent-service \
          #   --force-new-deployment
          echo "✅ Deploy step ready — uncomment ECS command when cluster is configured"

      - name: Notify deployment
        run: echo "✅ Module 1 AI Agent deployed at $(date)"