name: Module 1 tests

on:
  push:
    branches: [main]
    paths:
      - "module-1-ai-agents/**"
      - ".github/workflows/module-1-tests.yml"
  pull_request:
    paths:
      - "module-1-ai-agents/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module-1-ai-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module-1-ai-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v --tb=short
