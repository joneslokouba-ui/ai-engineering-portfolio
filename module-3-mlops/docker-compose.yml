# ── Module 3: MLOps Local Dev Stack ──────────────────────────────────────────
# Geoffrey Jones Okwi | AI Engineering Portfolio
# Usage: docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Main Streamlit App ─────────────────────────────────────────────────────
  app:
    build: .
    container_name: module3-app
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=development
    volumes:
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow
      - prometheus
    networks:
      - mlops-network
    restart: unless-stopped

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: module3-mlflow
    command: >
      sh -c "pip install mlflow==2.19.0 -q &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri sqlite:///mlruns/mlflow.db
             --default-artifact-root /mlruns/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    networks:
      - mlops-network
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: module3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mlops-network
    restart: unless-stopped

  # ── Grafana (Bonus — visualize Prometheus) ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: module3-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mlops123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - mlops-network
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlruns: